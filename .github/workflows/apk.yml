name: APK Bureau PATH

on:
  push:
    branches: [bureau-path-apk]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Construire l'APK
        run: gradle --no-daemon assembleDebug

      - name: Publier l'APK (lien de téléchargement direct)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Bureau-PATH.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk Bureau-PATH.apk \
            --target "${GITHUB_SHA}" \
            --title "Bureau PATH (Android)" \
            --notes "Appli Android du bureau PATH. Sur le téléphone : télécharger Bureau-PATH.apk, l'ouvrir, autoriser l'installation, puis se connecter à Claude avec « Continuer avec l'e-mail »."

      - uses: actions/upload-artifact@v4
        with:
          name: Bureau-PATH
          path: Bureau-PATH.apk
